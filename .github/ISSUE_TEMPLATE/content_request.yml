name: Content request
description: Request or propose a blog post, tutorial, or guide
title: "content: "
labels: ["content", "needs-triage"]
body:
  - type: textarea
    id: topic
    attributes:
      label: Topic
      description: What should RunAny cover?
      placeholder: Example: Set up Ollama with Open WebUI on a VPS.
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Audience and goal
      description: Who is this for, and what should they learn or do after reading?
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: Suggested outline or references
      description: Add rough sections, links, commands, screenshots, or notes.
  - type: checkboxes
    id: content-type
    attributes:
      label: Content type
      options:
        - label: Tutorial
        - label: Setup guide
        - label: Product review
        - label: Developer tools
        - label: News/update
