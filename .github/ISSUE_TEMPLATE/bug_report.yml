name: Bug report
description: Report something broken in RunAny
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail so maintainers can reproduce it.
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What happened?
      placeholder: Describe the bug.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List exact steps, commands, URLs, or minimal examples.
      placeholder: |
        1. Run `npm install`
        2. Run `npm run dev`
        3. Open ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, npm version, browser, package manager.
      render: markdown
      placeholder: |
        - OS:
        - Node.js:
        - npm:
        - Browser:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs, errors, or screenshots.
      render: shell
