name: Feature request
description: Suggest an improvement for RunAny
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please explain problem first, then solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or workflow gap does this solve?
      placeholder: I want to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - API
        - Webhook service
        - Blog/content
        - Documentation
        - Tooling
        - Other
    validations:
      required: true
