name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - run: npm ci

      - name: Build Astro site
        run: npm run build:web
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          # The Astro build loads every blog post into memory at once. Node's
          # default heap cap (~4GB) is no longer enough now that the blog has
          # 1700+ posts: the build died with "Ineffective mark-compacts near
          # heap limit / JavaScript heap out of memory" on 2026-10-29. A local
          # build of the same tree peaks around 5.9GB RSS, so raise the cap.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4'
          command: pages deploy apps/web/dist --project-name runany --branch ${{ github.ref_name }}
